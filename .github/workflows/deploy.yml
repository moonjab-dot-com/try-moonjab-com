name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # GITHUB_PAGES removed — it was forcing base: "/oficial-moonjab/" which broke the site
          VITE_SUPABASE_URL: "https://vajjrwoiufqdbziwluih.supabase.co"
          VITE_SUPABASE_ANON_KEY: "sb_publishable_JS8pSfRHLSXHTvbde7nqkw_fUcCh1rh"
          VITE_SUPABASE_PROJECT_ID: "vajjrwoiufqdbziwluih"

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Add CNAME for custom domain
        run: echo "moonjab.com" > dist/CNAME

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
