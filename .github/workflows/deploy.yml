name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ─── Deploy Supabase Edge Functions ───────────────────────────────────────
  # Runs independently of the frontend build so a broken/expired
  # SUPABASE_ACCESS_TOKEN can never block the website from deploying.
  deploy-functions:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref vajjrwoiufqdbziwluih
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # One-time fix: this project's schema was originally created outside of
      # Supabase's migration tracking, so its migration history is empty and
      # `db push` tries to replay every migration from scratch (failing on
      # tables that already exist). Mark the pre-existing migrations as
      # already applied so only genuinely new ones get pushed going forward.
      - name: Repair migration history for pre-existing schema
        run: |
          supabase migration repair --status applied \
            20251112230849 20251114152927 20251114153022 20251114173346 \
            20251114174551 20251206013625 20251213160435 20260314222203 \
            20260315014833 20260316004741 20260316005007 20260503004735 \
            20260512000000 || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: DEBUG - dump full live schema
        run: |
          supabase db dump --linked --schema public -f /tmp/full_schema.sql
          echo "===FULL SCHEMA DUMP START==="
          cat /tmp/full_schema.sql
          echo "===FULL SCHEMA DUMP END==="
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # db push is intentionally disabled: this repo's migration files
      # (profiles.id, cvs, interview_sessions, analytics_events, etc.)
      # do not match the live database's actual schema (confirmed via
      # `supabase db dump`, which shows a `profiles` table keyed on
      # `user_id` with a minimal trial/free/premium `role` column — not
      # the schema these migrations assume). Pushing migrations against
      # a schema this different from what's tracked risks real damage.
      # Re-enable only after reconciling the migrations folder with the
      # actual production schema.
      # - name: Push database migrations
      #   run: supabase db push --yes
      #   env:
      #     SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      #     SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy create-checkout --project-ref vajjrwoiufqdbziwluih
          supabase functions deploy check-subscription --project-ref vajjrwoiufqdbziwluih
          supabase functions deploy customer-portal --project-ref vajjrwoiufqdbziwluih
          supabase functions deploy complete-referral --project-ref vajjrwoiufqdbziwluih
          supabase functions deploy send-lead-magnet --project-ref vajjrwoiufqdbziwluih
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ─── Build & Deploy Frontend ───────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Add CNAME for custom domain
        run: echo "moonjab.com" > dist/CNAME

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
