        <section aria-label="Características principales" class="ns-sec">
          <h2>¿Por qué elegir MoonJab para crear tu CV y preparar entrevistas?</h2>
          <p>MoonJab es la plataforma de empleabilidad con inteligencia artificial diseñada específicamente para estudiantes universitarios y jóvenes profesionales en Latinoamérica. Combinamos un potente CV builder optimizado para ATS con un simulador de entrevistas laborales con IA y un diagnóstico vocacional RIASEC para darte todo lo que necesitas para conseguir tu primer empleo o prácticas profesionales. Más de 10,000 estudiantes en toda la región ya construyeron su carrera con MoonJab.</p>
          <ul>
            <li><strong>CV builder con IA y optimización ATS:</strong> Nuestro constructor de currículum con inteligencia artificial analiza tu perfil, sugiere mejoras y genera un CV profesional optimizado para pasar los filtros ATS (Applicant Tracking Systems) usados por grandes empresas en Perú, México, Colombia, Argentina y Chile. La IA detecta palabras clave faltantes, mejora tu redacción y adapta el formato a cada tipo de puesto.</li>
            <li><strong>Simulador de entrevistas laborales con IA:</strong> Practica entrevistas de trabajo reales con nuestro entrevistador virtual. Elige el tipo de entrevista (técnica, conductual, STAR), responde en voz o texto y recibe feedback inmediato sobre contenido, estructura y confianza. Identifica áreas de mejora y gana confianza antes de tu entrevista real con empresas top.</li>
            <li><strong>Diagnóstico vocacional RIASEC con IA:</strong> Descubre tu perfil profesional con nuestro test de diagnóstico vocacional basado en el modelo RIASEC. La inteligencia artificial analiza tus resultados y te recomienda rutas de carrera, industrias alineadas y roles específicos según tus fortalezas naturales.</li>
